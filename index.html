<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор позиции — Futures x10</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{margin:0;background:#101318;color:#f4f6fa;padding:20px}.card{max-width:480px;margin:0 auto;background:#1b2029;border:1px solid #303846;border-radius:18px;padding:20px}h1{font-size:1.35rem;margin-top:0}label{display:block;margin:16px 0 6px;color:#b9c2d0}input{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #414b5b;background:#10151d;color:#fff;font-size:1rem}.meta{background:#111720;padding:12px;border-radius:10px;line-height:1.7;font-size:.95rem}.buttons{display:flex;gap:10px;margin-top:16px}.buttons button{flex:1;padding:13px 8px;border:0;border-radius:10px;background:#f0b90b;color:#111;font-weight:800;font-size:1rem}.result{margin-top:16px;padding:14px;border-radius:12px;background:#14251e;line-height:1.8}.muted{font-size:.82rem;color:#aeb8c7;margin-top:14px} .error{color:#ff8f8f}
</style>
</head>
<body><main class="card">
<h1>Калькулятор позиции · Futures ×10</h1>
<div class="meta" id="setup">Загружаю параметры сигнала…</div>
<label for="balance">Баланс фьючерсного счёта (USDT)</label>
<input id="balance" type="number" min="0" step="any" placeholder="Например, 250">
<div class="buttons"><button onclick="calculate(1.5)">Риск 1,5%</button><button onclick="calculate(2)">Риск 2%</button></div>
<div id="result" class="result" aria-live="polite">Укажи баланс и выбери допустимый риск.</div>
<p class="muted">Расчёт приблизительный: комиссия, проскальзывание и funding не включены. Плечо влияет на требуемую маржу, но не меняет сумму риска при стопе. Проверь цену и режим маржи перед входом.</p>
</main>
<script>
const q=new URLSearchParams(location.search);
const symbol=q.get('symbol')||'—', direction=q.get('direction')||'—';
const entry=Number(q.get('entry')), stop=Number(q.get('stop'));
document.getElementById('setup').innerHTML='<b>'+escapeHtml(symbol)+'</b> · '+escapeHtml(direction)+'<br>Вход: '+(entry>0?entry:'не задан')+'<br>Стоп: '+(stop>0?stop:'не задан')+'<br>Плечо: ×10';
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return n.toLocaleString('ru-RU',{maximumFractionDigits:6});}
function calculate(percent){
 const balance=Number(document.getElementById('balance').value), out=document.getElementById('result');
 if(!(balance>0)){out.innerHTML='<span class="error">Введи баланс больше нуля.</span>';return;}
 if(!(entry>0&&stop>0&&entry!==stop)){out.innerHTML='<span class="error">В ссылке сигнала нет корректных цены входа и стопа.</span>';return;}
 const risk=balance*percent/100, distance=Math.abs(entry-stop), qty=risk/distance, notional=qty*entry, margin=notional/10;
 out.innerHTML='<b>Риск '+String(percent).replace('.',',')+'%:</b> '+fmt(risk)+' USDT<br><b>Количество:</b> '+fmt(qty)+' '+escapeHtml(symbol.replace(/USDT$/,''))+'<br><b>Объём позиции:</b> '+fmt(notional)+' USDT<br><b>Маржа при ×10:</b> ≈ '+fmt(margin)+' USDT<br><b>Убыток при стопе:</b> ≈ '+fmt(risk)+' USDT';
}
</script></body></html>
